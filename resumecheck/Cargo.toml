[package]
name = "resumecheck"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-lite = { version = "2.6.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "time", "fs"] }
toml = "1.1.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }
